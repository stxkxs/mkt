version: '3'

vars:
  BINARY: mkt
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "none"
  DATE:
    sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
  LDFLAGS: >-
    -s -w
    -X github.com/stxkxs/mkt/cmd.version={{.VERSION}}
    -X github.com/stxkxs/mkt/cmd.commit={{.COMMIT}}
    -X github.com/stxkxs/mkt/cmd.date={{.DATE}}

tasks:
  build:
    desc: Build the binary
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BINARY}} .

  install:
    desc: Install mkt into GOBIN (or GOPATH/bin) with version ldflags
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" .

  run:
    desc: Build and run
    deps: [build]
    cmds:
      - ./{{.BINARY}}

  test:
    desc: Run tests
    cmds:
      - go test ./...

  cover:
    desc: Run tests with the race detector and apply the coverage gate CI applies
    cmds:
      - go test -race -count=1 -coverprofile=cover.out ./...
      - scripts/coverage-gate.sh cover.out

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...

  vuln:
    desc: Report known vulnerabilities reachable from called code (govulncheck, as CI runs it)
    cmds:
      - govulncheck ./...

  demo:
    desc: Render the demo GIF from demo/mkt.tape (requires vhs; uses your ~/.config/mkt watchlist)
    deps: [build]
    cmds:
      - vhs demo/mkt.tape

  release-snapshot:
    desc: Build a local snapshot release (all platforms, no publish) via goreleaser
    cmds:
      - goreleaser release --snapshot --clean

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}} cover.out
      - rm -rf dist/

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy
