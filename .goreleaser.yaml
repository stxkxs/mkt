# GoReleaser config — cross-platform release archives + checksums.
# Cut a release by pushing a semver tag (e.g. `git tag v0.1.0 && git push --tags`);
# the .github/workflows/release.yml workflow runs `goreleaser release`.
# Local dry run: `task release-snapshot` (or `goreleaser release --snapshot --clean`).
version: 2

project_name: mkt

before:
  hooks:
    - go mod tidy

builds:
  - id: mkt
    main: .
    binary: mkt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Match the Taskfile ldflags so `mkt version` reports the tag/commit/date.
    ldflags:
      - -s -w
      - -X github.com/stxkxs/mkt/cmd.version={{ .Version }}
      - -X github.com/stxkxs/mkt/cmd.commit={{ .ShortCommit }}
      - -X github.com/stxkxs/mkt/cmd.date={{ .CommitDate }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: mkt
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

# Software bill of materials per archive (syft), for downstream provenance.
sboms:
  - artifacts: archive

# Keyless (OIDC) signature over the checksums file via cosign — verifiable
# with `cosign verify-blob --certificate checksums.txt.pem
# --signature checksums.txt.sig checksums.txt`.
signs:
  - cmd: cosign
    certificate: '${artifact}.pem'
    signature: '${artifact}.sig'
    args:
      - sign-blob
      - '--output-certificate=${certificate}'
      - '--output-signature=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

# A Homebrew tap is deliberately NOT enabled here. `brew_casks` / `homebrew_casks`
# has to push a formula into a second repository (github.com/stxkxs/homebrew-tap),
# which the workflow's default GITHUB_TOKEN cannot write to — it would need a PAT
# in secrets.HOMEBREW_TAP_TOKEN. Enabling it without that token turns every
# release red at the last step, after the artifacts are already signed and
# uploaded. To turn it on: create the tap repo, add the PAT, then append
#
#   homebrew_casks:
#     - name: mkt
#       repository: { owner: stxkxs, name: homebrew-tap, token: "{{ .Env.HOMEBREW_TAP_TOKEN }}" }
#       homepage: https://github.com/stxkxs/mkt
#       description: Real-time terminal market dashboard for stocks and crypto
#
# Until then the README documents `go install` and the signed release archives.

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  footer: |
    ---
    Full changelog and checksums attached. Verify with `sha256sum -c checksums.txt`.
