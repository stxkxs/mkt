# Version updates wait default-days after a release. Security updates are
# the repository's Dependabot security updates setting and skip this wait.
# Go modules share one pull request. A single-module bump rewrites go.sum
# for the rest of the graph, and the tidy job rejects that sum.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
