name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable from release.yml. A tag push runs this entire workflow before
  # goreleaser is allowed to publish, so a broken tag cannot ship signed
  # artifacts that never saw lint, tests or govulncheck.
  workflow_call:

permissions:
  contents: read

jobs:
  # mkt ships six cross-platform targets and picks its desktop notification
  # helper per GOOS, so the notifier is a distinct code path on each of the
  # three. Testing only on Linux leaves two thirds of the release matrix
  # unexercised.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
          - os: macos-latest
            race: "-race"
          # The race detector needs a C toolchain on windows/amd64, which the
          # runner image does not guarantee. The Windows job exists to prove
          # the per-OS notifier and terminal paths build and behave, not to
          # re-check concurrency the other two legs already cover.
          - os: windows-latest
            race: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # shell: bash on every leg. PowerShell's native-argument parsing
      # splits -coverprofile=cover.out, and go then reads ".out" as a
      # package path and fails the run before a single test executes.
      - name: go test
        shell: bash
        run: go test ${{ matrix.race }} -count=1 -coverprofile=cover.out ./...

      # The total must stay at or above a ratcheted floor, and every
      # trust-boundary file listed in the script must be fully covered.
      # scripts/coverage-gate.sh holds both thresholds and the file list.
      - name: coverage gate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/coverage-gate.sh cover.out

  # Compile every target .goreleaser.yaml publishes. Catches per-OS build
  # constraints that the three test legs above cannot reach (linux/arm64,
  # darwin/amd64 and windows/arm64 have no runner).
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

  # goreleaser builds the tagged binaries from the committed go.mod/go.sum
  # with no tidy hook, so a stale module graph would ship unverified. This
  # is the job that keeps the committed files honest.
  tidy:
    name: go mod tidy is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code --stat go.mod go.sum

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # Fails the build on any known vulnerability affecting a code path we
      # actually call (govulncheck is call-graph aware, so it won't flag
      # unreachable CVEs).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
