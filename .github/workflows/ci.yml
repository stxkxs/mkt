name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable from release.yml. A tag push runs this entire workflow before
  # goreleaser is allowed to publish, so a broken tag cannot ship signed
  # artifacts that never saw lint, tests or govulncheck.
  workflow_call:

permissions:
  contents: read

jobs:
  # mkt ships six cross-platform targets and links a notification stack
  # (beeep -> go-toast on Windows, systray/esiqveland-notify on Linux,
  # NSUserNotification on macOS) with real per-OS code paths. Testing only on
  # Linux leaves two thirds of the release matrix unexercised.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
          - os: macos-latest
            race: "-race"
          # The race detector needs a C toolchain on windows/amd64, which the
          # runner image does not guarantee. The Windows job exists to prove
          # the per-OS notifier and terminal paths build and behave, not to
          # re-check concurrency the other two legs already cover.
          - os: windows-latest
            race: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # shell: bash on every leg. PowerShell's native-argument parsing
      # splits -coverprofile=cover.out, and go then reads ".out" as a
      # package path and fails the run before a single test executes.
      - name: go test
        shell: bash
        run: go test ${{ matrix.race }} -count=1 -coverprofile=cover.out ./...

      # A ratchet, not a target. 82% is what the tree carries; the gate
      # stops a change from quietly trading coverage for features. Raise
      # the floor when the number moves up, never lower it to go green.
      - name: coverage floor
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          floor=80.0
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${total}% (floor ${floor}%)"
          awk -v t="$total" -v f="$floor" 'BEGIN { exit !(t < f) }' && {
            echo "::error::coverage ${total}% is below the ${floor}% floor"
            exit 1
          }
          exit 0

  # Compile every target .goreleaser.yaml publishes. Catches per-OS build
  # constraints that the three test legs above cannot reach (linux/arm64,
  # darwin/amd64 and windows/arm64 have no runner).
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

  # goreleaser builds the tagged binaries from the committed go.mod/go.sum
  # with no tidy hook, so a stale module graph would ship unverified. This
  # is the job that keeps the committed files honest.
  tidy:
    name: go mod tidy is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code --stat go.mod go.sum

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.13.2
          args: --timeout=5m

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Fails the build on any known vulnerability affecting a code path we
      # actually call (govulncheck is call-graph aware, so it won't flag
      # unreachable CVEs).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
