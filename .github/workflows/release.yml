name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ci.yml triggers on push-to-main and pull requests, not on tags, so a tag
  # pushed from a branch (or moved onto an untested commit) would otherwise
  # reach goreleaser with nothing verified. Running the full suite as a gate
  # means a broken tag fails before anything signed is published.
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    name: goreleaser
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Pinned so a release is built by the goreleaser the tree was
          # last verified with; Renovate proposes the next one.
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
