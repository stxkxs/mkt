name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ci.yml only triggers on push-to-main and pull requests, so a tag pushed
  # from a branch (or a tag moved onto an untested commit) used to reach
  # goreleaser with nothing verified. Running the full suite as a gate means a
  # broken tag fails before anything signed is published.
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    name: goreleaser
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
